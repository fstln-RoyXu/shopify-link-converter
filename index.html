<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert Shopify admin theme editor URLs to storefront preview URLs">
  <title>Shopify Link Converter</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>
        <span>🔗</span>
        Shopify Link Converter
      </h1>
      <p>Convert Shopify admin theme editor URLs to storefront preview URLs</p>
    </header>

    <!-- Single Mode -->
    <div id="singleMode">
      <div class="card">
        <div class="form-group">
          <label class="form-label" for="adminUrl">Admin URL (paste to convert automatically)</label>
          <div class="conversion-input-row">
            <input 
              type="text" 
              class="input" 
              id="adminUrl" 
              placeholder="https://admin.shopify.com/store/yourstore/themes/123456/editor?previewPath=..."
              autocomplete="off"
            >
            <button class="btn" id="convertBtn">
              转换
            </button>
          </div>
        </div>

        <!-- Single Result -->
        <div class="result" id="singleResult">
          <div class="result-header success">
            <span class="result-icon">✓</span>
            <span>转换成功</span>
          </div>

          <div class="form-group preview-output">
            <label class="form-label">店铺预览链接</label>
            <div class="output-group">
              <input 
                type="text" 
                class="input" 
                id="storefrontUrl" 
                readonly
              >
              <div class="output-actions">
                <button class="btn-icon" id="copyBtn" title="复制链接">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>
                <button class="btn-icon" id="openBtn" title="在新标签页打开">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div id="conversionError" class="error-message" hidden></div>
        </div>

        <!-- Tips stay visible even when there is no conversion result. -->
        <div class="tips">
          <div class="tip">
            <span class="tip-icon">💡</span>
            <div class="tip-content">
              <strong>Password page?</strong>
              <p lang="zh-CN">如果出现密码页面，请先输入密码，再重新打开预览链接。</p>
            </div>
          </div>
          <div class="tip">
            <span class="tip-icon">💡</span>
            <div class="tip-content">
              <strong>404?</strong>
              <p lang="zh-CN">如果预览页面无法显示，请检查页面的可见性设置。将“Hidden（隐藏）”改为“Visible（可见）”，或选择其他可见页面。</p>
              <div class="tip-images">
                <img src="assets/image1.png" alt="检查页面是否设为 Hidden（隐藏）">
                <img src="assets/image2.png" alt="将页面改为 Visible（可见）">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-xl" style="color: var(--text-secondary); font-size: 0.875rem;">
      <p>Built for Shopify theme developers and operations teams</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="js/converter.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
